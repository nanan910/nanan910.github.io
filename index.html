<!DOCTYPE html>
    <html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>厉望东永久直链托管</title>
        <style>
            :root {
                --glass-bg: rgba(255, 255, 255, 0.12);
                --glass-border: rgba(255, 255, 255, 0.2);
                --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
                --text-primary: #ffffff;
                --accent-color: #4a6cf7;
                --accent-hover: #3a5ce5;
            }

            * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

            body {
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: flex-start;
                color: var(--text-primary);
                overflow: hidden;
                position: relative;
                padding: 15px;
                padding-top: 8vh;
            }

            /* 视频背景 - 高清 */
            .bg-video {
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                object-fit: cover;
                z-index: -2;
                image-rendering: auto;
            }
            .background-overlay {
                position: fixed;
                top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0, 0, 0, 0.15);
                z-index: -1;
            }

            .avatar-container {
                text-align: center;
                margin-bottom: 0;
                line-height: 0;
                animation: avatarEnter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            }
            @keyframes avatarEnter {
                0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
                100% { opacity: 1; transform: scale(1) rotate(0); }
            }
            .avatar-img {
                width: 90px;
                height: 90px;
                border-radius: 50%;
                object-fit: cover;
                border: none;
                background: transparent;
                transition: transform 0.3s ease;
                display: block;
                margin: 0 auto;
            }
            .avatar-img:hover { transform: scale(1.05); }

            .page-title {
                text-align: center;
                font-size: 32px;
                font-weight: 700;
                margin-bottom: 15px;
                background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57, #ff9ff3, #54a0ff);
                background-size: 400% 400%;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                animation: gradient 8s ease infinite, titleEnter 1s ease both;
            }
            @keyframes titleEnter {
                0% { opacity: 0; transform: translateY(-30px); letter-spacing: 8px; }
                100% { opacity: 1; transform: translateY(0); letter-spacing: normal; }
            }
            @keyframes gradient {
                0% { background-position: 0% 50%; }
                50% { background-position: 100% 50%; }
                100% { background-position: 0% 50%; }
            }

            .main-layer { width: 100%; max-width: 450px; margin-top: 0; }
            
            .glass-card {
                background: rgba(0, 0, 0, 0.25);
                backdrop-filter: blur(20px);
                border-radius: 16px;
                border: 1px solid rgba(255, 255, 255, 0.15);
                padding: 25px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                text-align: center;
                margin-top: 30px;
                animation: cardFloat 3s ease-in-out infinite;
            }
            @keyframes cardFloat {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-6px); }
            }

            .upload-zone {
                border-radius: 12px;
                padding: 30px 20px 25px;
                cursor: pointer;
                background: rgba(255, 255, 255, 0.08);
                margin-bottom: 15px;
                transition: 0.3s;
                position: relative;
            }
            .upload-zone:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.02); }

            .upload-hint {
                margin-top: 15px;
                font-size: 12px;
                color: #ff9f9f;
                background: rgba(255, 100, 100, 0.15);
                backdrop-filter: blur(2px);
                padding: 8px 10px;
                border-radius: 20px;
                display: inline-block;
                border: 1px dashed rgba(255, 159, 159, 0.5);
                line-height: 1.5;
                font-weight: 500;
            }
            .upload-hint span {
                font-weight: 600;
                background: #ff6b6b;
                color: white;
                border-radius: 16px;
                padding: 2px 8px;
                margin: 0 2px;
                font-size: 11px;
            }

            .btn {
                background: var(--accent-color);
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 6px;
                cursor: pointer;
                font-weight: 600;
                width: 100%;
                transition: 0.3s;
            }

            #progressSection, #resultSection { display: none; margin-top: 20px; }
            .progress-bar { background: rgba(255,255,255,0.15); height: 8px; border-radius: 4px; overflow: hidden; margin: 10px 0; }
            .progress-fill { width: 0%; height: 100%; background: var(--accent-color); transition: 0.3s; }

            .result-item { text-align: left; margin-bottom: 15px; }
            .label { font-size: 11px; color: #ccc; font-weight: bold; margin-bottom: 4px; display: block; }
            .input-group {
                display: flex; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); border-radius: 6px; padding: 4px;
            }
            .input-group input { flex: 1; background: transparent; border: none; padding: 6px; font-size: 12px; outline: none; color: #fff; }
            .btn-copy { background: var(--accent-color); color: white; border: none; padding: 0 12px; border-radius: 4px; font-size: 11px; cursor: pointer; }

            .music-player { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }
            .music-toggle {
                width: 50px; height: 50px; border-radius: 50%; background: var(--glass-bg);
                backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
                display: flex; align-items: center; justify-content: center; cursor: pointer;
                box-shadow: var(--glass-shadow);
            }
            .music-toggle.playing { animation: rotate 3s linear infinite; }
            @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
            .music-toggle::after { content: "♫"; font-size: 24px; color: var(--accent-color); }
            
            #retryNotice { display: none; }

            /* 导航链接 */
            .nav-links {
                margin-top: 20px;
                display: flex;
                justify-content: center;
                gap: 15px;
            }
            .nav-links a {
                color: #fff;
                text-decoration: none;
                font-size: 13px;
                font-weight: 600;
                padding: 6px 14px;
                border-radius: 20px;
                background: rgba(74, 108, 247, 0.3);
                transition: 0.3s;
            }
            .nav-links a:hover {
                background: var(--accent-color);
                color: white;
            }
        </style>
    </head>
    <body>

        <video class="bg-video" autoplay muted loop playsinline>
            <source src="bg.mp4" type="video/mp4">
        </video>
        <div class="background-overlay"></div>

        <div class="main-layer">
            <div class="page-title">厉望东永久直链托管</div>
            
            <div class="avatar-container">
                <img class="avatar-img" src="https://mpimg.cn/view.php/f28da3eac8f392e9fa2ba91723b2bf4c.png" alt="厉望东头像" title="厉望东">
            </div>

            <div class="glass-card">
                <div id="uploadForm">
                    <div class="upload-zone" id="dropZone">
                        <div style="font-size: 40px;">🔗</div>
                        <p style="font-size: 14px; color: #ddd; margin-top: 5px;">点击或将文件拖拽至此处</p>
                        <div class="upload-hint">
                            ⚡ 禁止上传 <span>apk</span> <span>html</span> <span>htm</span> <span>shtml</span> <span>shtm</span> · 最大 80MB
                        </div>
                        <input type="file" id="fileInput" hidden>
                    </div>
                    <button class="btn" onclick="document.getElementById('fileInput').click()">选择文件并上传</button>
                </div>

                <div id="progressSection">
                    <p style="font-size: 13px;">正在上传到云端永久储存中…</p>
                    <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
                    <p id="percentText" style="font-size: 12px; color: var(--accent-color);">0%</p>
                    <p id="retryNotice" style="display:none;"></p>
                </div>

                <div id="resultSection">
                    <div class="result-item">
                        <span class="label">🔗 永久直链 (API原生地址)</span>
                        <div class="input-group">
                            <input type="text" id="rawLink" readonly>
                            <button class="btn-copy" onclick="copyValue('rawLink', this)">复制</button>
                        </div>
                    </div>
                    <button class="btn" style="background:transparent; border:1px solid var(--accent-color); color:var(--accent-color);" onclick="location.reload()">重新上传</button>
                </div>

                <div class="nav-links">
                    <a href="nav.html">📚 资源导航</a>
                </div>
            </div>
        </div>

        <div class="music-player">
            <div class="music-toggle" id="musicToggle"></div>
        </div>
        <audio id="bgMusic" loop src="https://mpimg.cn/view.php/ac863e4b37bd7eb8388e97f15aed64dc.mp3"></audio>

        <script>
            const bgMusic = document.getElementById('bgMusic');
            const musicToggle = document.getElementById('musicToggle');
            const fileInput = document.getElementById('fileInput');
            const dropZone = document.getElementById('dropZone');

            // 音乐播放逻辑
            window.addEventListener('load', () => {
                bgMusic.muted = true;
                bgMusic.play().then(() => {
                    musicToggle.classList.add('playing');
                    document.body.addEventListener('click', () => { bgMusic.muted = false; }, { once: true });
                }).catch(() => {});
            });

            musicToggle.onclick = () => {
                if (bgMusic.paused) { bgMusic.play(); musicToggle.classList.add('playing'); }
                else { bgMusic.pause(); musicToggle.classList.remove('playing'); }
            };

            // --- 核心配置 ---
            const API = 'https://pan.szfx.top/api.php';

            // 界面事件
            dropZone.onclick = () => fileInput.click();
            fileInput.onchange = (e) => { if(e.target.files[0]) handleUpload(e.target.files[0]); };
            
            // 拖拽上传
            dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = 'rgba(255,255,255,0.2)'; });
            dropZone.addEventListener('dragleave', () => { dropZone.style.background = 'rgba(255,255,255,0.08)'; });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.style.background = 'rgba(255,255,255,0.08)';
                if(e.dataTransfer.files[0]) handleUpload(e.dataTransfer.files[0]);
            });

            // 上传主逻辑
            async function handleUpload(file) {
                document.getElementById('uploadForm').style.display = 'none';
                document.getElementById('progressSection').style.display = 'block';

                const fd = new FormData();
                fd.append('file', file);
                fd.append('format', 'json');

                const xhr = new XMLHttpRequest();
                xhr.open('POST', API);

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        document.getElementById('progressBar').style.width = percent + '%';
                        document.getElementById('percentText').innerText = percent + '%';
                    }
                };

                xhr.onload = () => {
                    try {
                        const responseText = xhr.responseText.trim();
                        const jsonData = JSON.parse(responseText);
                        
                        if (jsonData.code === 0 && jsonData.downurl) {
                            const raw = jsonData.downurl;
                            document.getElementById('rawLink').value = raw;
                            
                            document.getElementById('progressSection').style.display = 'none';
                            document.getElementById('resultSection').style.display = 'block';
                            return;
                        } else {
                            alert('上传失败：' + (jsonData.msg || '未知错误'));
                            location.reload();
                        }
                    } catch (e) {
                        if (xhr.status === 200) {
                            const urlMatch = responseText.match(/https?:\/\/[^\s"']+/);
                            if (urlMatch) {
                                const raw = urlMatch[0];
                                document.getElementById('rawLink').value = raw;
                                document.getElementById('progressSection').style.display = 'none';
                                document.getElementById('resultSection').style.display = 'block';
                                return;
                            }
                        }
                        alert('上传失败：服务器返回格式异常');
                        location.reload();
                    }
                };

                xhr.onerror = () => {
                    alert('网络错误，上传失败。请检查网络连接。');
                    location.reload();
                };

                xhr.send(fd);
            }

            function copyValue(id, btn) {
                const input = document.getElementById(id);
                input.select();
                document.execCommand('copy');
                const originalText = btn.innerText;
                btn.innerText = '成功';
                setTimeout(() => btn.innerText = originalText, 2000);
            }
        </script>
    </body>
    </html>
